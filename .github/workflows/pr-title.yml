name: PR title

# Pull requests are squash-merged, so the title becomes the commit message
# that release-please reads to pick the next version. Keep it a
# conventional commit: feat: / fix: / perf: / chore: ..., with ! for a
# breaking change.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            test
            ci
            build
            chore
          requireScope: false
