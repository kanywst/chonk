name: Release

# Versions follow semver and come from the commit messages, not from a human
# picking a number. On every push to main, release-please reads the
# conventional commits since the last release and keeps one release pull
# request open with the next version and its CHANGELOG entry:
#
#   fix:            patch  0.1.0 -> 0.1.1
#   feat:           minor  0.1.0 -> 0.2.0
#   feat!: / BREAKING CHANGE:  minor while below 1.0.0, major from then on
#   chore, ci, docs, test, refactor: no release on their own
#
# Merging that pull request tags vX.Y.Z and creates the GitHub release, and
# the goreleaser job below builds, signs and uploads the artifacts and pushes
# the Homebrew cask. A tag created with GITHUB_TOKEN does not start other
# workflows, which is why both steps live in this one.
#
# Pushing a v* tag by hand still works, for a release cut outside the bot.
#
# Requires "Allow GitHub Actions to create and approve pull requests" under
# Settings -> Actions -> General, and HOMEBREW_TAP_GITHUB_TOKEN (contents
# write on kanywst/homebrew-tap).

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  goreleaser:
    needs: release-please
    # Runs after release-please cut a release, or for a tag pushed by hand
    # (then release-please is skipped, which always() lets through).
    if: >-
      always() &&
      (needs.release-please.outputs.created == 'true' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign keyless signing
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3 # pinned: this job holds the signing identity and the tap token
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      # Verify with: gh attestation verify <archive> -R kanywst/chonk
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
