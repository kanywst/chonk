version: "2"

linters:
  default: standard
  enable:
    - misspell
    - modernize
    - revive
    - gosec
    - errorlint
    - nolintlint
    - usestdlibvars
  settings:
    gosec:
      excludes:
        # chonk runs each tool's own reclaim command by design; the commands are fixed in the rules, not user input.
        - G204
        # chonk reads directories anywhere under the scan roots; that is the
        # whole job.
        - G304
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kanywst/chonk
